<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1066" width="1100" height="1066" role="img" aria-labelledby="t d"><title id="t">9月15日(火) 新商品のニュースを公開した日</title><desc id="d">14時のニュース公開でサイトAへのリクエストが毎秒600に増え、回線が100Mbpsで頭打ちになる。14時20分にサイトBが毎秒120になりCPUが100%、エラーが増える。14時35分に客から電話、14時50分に再起動。</desc>
