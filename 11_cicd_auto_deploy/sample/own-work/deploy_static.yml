# 自分の作品を GitHub Pages に届けるワークフロー(発展・第14回・HTML / CSS / JS だけの作品)
# .github/workflows/deploy.yml という名前で置く
name: deploy

on:
  push:
    branches: [main]
  pull_request:       # PR のときは、テストだけ動く(公開はしない)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  # ★ 公開するフォルダの名前。自分の作品に合わせて変える(リポジトリの一番上なら .)
  SITE_DIR: public

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: node --test --test-reporter=spec

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    needs: build
    # 公開するのは main に入ったときだけ
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
