# 自分の作品を GitHub Pages に届けるワークフロー(発展・第14回・Vite でビルドする作品)
# .github/workflows/deploy.yml という名前で置く
# package.json と package-lock.json が、リポジトリの一番上にあること
name: deploy

on:
  push:
    branches: [main]
  pull_request:       # PR のときは、ビルドとテストだけ動く(公開はしない)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  # ビルドしてできるフォルダ(Vite は dist)
  SITE_DIR: dist

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # package-lock.json のとおりに入れる。部品の「入れたときに動くプログラム」は動かさない
      - run: npm ci --ignore-scripts

      # ./ にすると、リンクが相対パスになる(GitHub Pages の URL にはリポジトリ名が入るため)
      - run: npm run build -- --base=./

      - run: node --test --test-reporter=spec

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
